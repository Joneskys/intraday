<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Intraday Strategy Screener</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body {
  background: #0f172a;
  color: #e5e7eb;
  font-family: system-ui;
  margin: 0;
  padding: 20px;
}
h1 { margin-bottom: 10px; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 14px;
}
th, td {
  border: 1px solid #1f2937;
  padding: 8px;
  text-align: center;
}
th {
  background: #020617;
}
tr:nth-child(even) {
  background: #0b1220;
}
.green { color: #22c55e; font-weight: bold; }
.red { color: #ef4444; font-weight: bold; }
.orange { color: #f59e0b; font-weight: bold; }

button {
  background: #1f2937;
  color: white;
  border: 1px solid #334155;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
}
button:hover { background: #334155; }

input {
  background: #020617;
  color: white;
  border: 1px solid #334155;
  padding: 6px;
  border-radius: 6px;
}
</style>
</head>
<body>

<h1>📊 Intraday Strategy Screener (5-Min Logic)</h1>

<div>
  Budget: ₹ <input id="capital" value="25000" />
  <button onclick="runScan()">Scan Stocks</button>
</div>

<table>
<thead>
<tr>
  <th>Stock</th>
  <th>Signal</th>
  <th>Entry</th>
  <th>SL</th>
  <th>Target</th>
  <th>Qty (₹25k)</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
// ====== STOCK UNIVERSE ======
const STOCKS = ["SBIN", "RVNL", "HDFCBANK", "TCS", "RBLBANK"];

// ====== MOCK 5-MIN DATA GENERATOR ======
function generateCandles() {
  let candles = [];
  let price = 500 + Math.random() * 500;
  for (let i = 0; i < 50; i++) {
    let open = price;
    let close = open + (Math.random() - 0.5) * 10;
    let high = Math.max(open, close) + Math.random() * 3;
    let low = Math.min(open, close) - Math.random() * 3;
    let volume = 1000 + Math.random() * 2000;
    candles.push({ open, high, low, close, volume });
    price = close;
  }
  return candles;
}

// ====== INDICATORS ======
function EMA(values, period) {
  let k = 2 / (period + 1);
  let ema = values[0];
  for (let v of values) ema = v * k + ema * (1 - k);
  return ema;
}

function RSI(values, period = 14) {
  let gain = 0, loss = 0;
  for (let i = 1; i <= period; i++) {
    let diff = values[i] - values[i - 1];
    diff > 0 ? gain += diff : loss -= diff;
  }
  let rs = gain / (loss || 1);
  return 100 - (100 / (1 + rs));
}

// ====== STRATEGY ENGINE ======
function evaluate(candles) {
  let c = candles;
  let prev = c[c.length - 2];
  let curr = c[c.length - 1];

  let closes = c.map(x => x.close);
  let ema9_prev = EMA(closes.slice(-10, -1), 9);
  let ema21_prev = EMA(closes.slice(-22, -1), 21);
  let ema9 = EMA(closes.slice(-9), 9);
  let ema21 = EMA(closes.slice(-21), 21);
  let rsi = RSI(closes.slice(-15));
  
  let volumeUp = curr.volume > prev.volume;
  let breakout = curr.close > prev.high;
  let breakdown = curr.close < prev.low;

  // BUY
  if (
    curr.close > ema21 &&
    ema9_prev < ema21_prev &&
    ema9 > ema21 &&
    rsi > 60 &&
    breakout &&
    volumeUp
  ) {
    let entry = prev.high;
    let sl = prev.low;
    let target = entry + (entry - sl) * 2;
    return { type: "BUY", entry, sl, target };
  }

  // SELL
  if (
    curr.close < ema21 &&
    ema9_prev > ema21_prev &&
    ema9 < ema21 &&
    rsi < 40 &&
    breakdown &&
    volumeUp
  ) {
    let entry = prev.low;
    let sl = prev.high;
    let target = entry - (sl - entry) * 2;
    return { type: "SELL", entry, sl, target };
  }

  return { type: "NO TRADE" };
}

// ====== UI RENDER ======
function runScan() {
  const capital = Number(document.getElementById("capital").value);
  let html = "";

  for (let stock of STOCKS) {
    let candles = generateCandles();
    let result = evaluate(candles);

    if (result.type === "NO TRADE") {
      html += `<tr>
        <td>${stock}</td>
        <td class="orange">NO TRADE</td>
        <td>-</td><td>-</td><td>-</td><td>-</td>
      </tr>`;
      continue;
    }

    let qty = Math.floor(capital / result.entry);

    html += `<tr>
      <td>${stock}</td>
      <td class="${result.type === 'BUY' ? 'green' : 'red'}">${result.type}</td>
      <td>${result.entry.toFixed(2)}</td>
      <td>${result.sl.toFixed(2)}</td>
      <td>${result.target.toFixed(2)}</td>
      <td>${qty}</td>
    </tr>`;
  }

  document.getElementById("tbody").innerHTML = html;
}
</script>
</body>
</html>
